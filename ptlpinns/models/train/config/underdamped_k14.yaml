# underdamped_k14: 14 heads aligned with the paper's evaluation setup AND
# with the spectral / envelope structure of the standard cubic perturbation
# hierarchy.
#
# Paper evaluation zetas (in order of priority):
#   PRIMARY   : zeta in {0.1, 0.2}   (results/oscillator/underdamped.ipynb zeta_list)
#   SECONDARY : zeta = 0.4           (results/oscillator/underdamped_epsilon_sweep.ipynb)
#   TERTIARY  : zeta in {0.25, 0.5, 0.6, 0.7}  (hyperparameter sweep)
# All paper evaluations use IC (1,0), unforced Duffing, and t_span=(0, 10).
#
# Forcing model in `underdamped_forcing(...)`:
#   F(t) = sum_k coef[k] * cos(freq[k] * sqrt(1-zeta^2) * t) * exp(-mu*zeta*t)
#
# Perturbation hierarchy structure (omega_d = sqrt(1-zeta^2)):
#   u_0(t)  ~ e^(-zeta t) * cos(omega_d t - phi)
#   F_1     = -u_0^3 ~ e^(-3 zeta t) * [cos(omega_d t) + cos(3 omega_d t)/3]
#   F_2,3.. ~ e^(-3..5 zeta t) * harmonics in {omega_d, 3 omega_d, 5 omega_d, 7 omega_d}
#
# Design:
#   - 7 UNFORCED heads, IC (1,0), one per paper zeta:
#       order-0 problem L u_0 = 0 at every test zeta (0.1, 0.2, 0.25, 0.4, 0.5, 0.6, 0.7).
#   - 7 FORCED heads, IC (0,0), all mu=3 with odd harmonics of omega_d:
#       proxies for higher-order RHS F_j. Concentrated at primary paper zetas
#       (0.1, 0.2) and secondary (0.4); spectral mix of freq=[1,3] and [1,3,5].
#   - mu=3 only: the dominant envelope of every F_j is exp(-3 zeta t); larger
#     mu would only capture sub-dominant fast modes and decay too quickly to
#     train on at higher zeta.
#
# t_max=15 (training) vs t_span=(0,10) (inference): 5-unit buffer past the
# inference window so the basis is not influenced by boundary effects right at
# t=10, and so the basis is exposed to the late-time oscillation at zeta=0.1
# where the actual Duffing solution still has ~22% of initial amplitude at t=15.
experiment: "underdamped_k14"
N: 5120
t_max: 15.0
seed: 42
k: 14

defaults: &defaults
  w0: 1.0
  zeta: 0.0
  ic: [0.0, 0.0]
  forcing: { freq: [0], coef: [0] }
  mu: 0.0

heads:
  # ---------------- 7 unforced heads: order-0 at every paper zeta ----------------
  - <<: *defaults                          # PRIMARY paper zeta
    zeta: 0.1
    ic: [1.0, 0.0]
  - <<: *defaults                          # PRIMARY paper zeta
    zeta: 0.2
    ic: [1.0, 0.0]
  - <<: *defaults                          # hyperparam-sweep zeta
    zeta: 0.4
    ic: [1.0, 0.0]
  - <<: *defaults                          # SECONDARY paper zeta (epsilon sweep)
    zeta: 0.6
    ic: [1.0, 0.0]
  - <<: *defaults                          # hyperparam-sweep zeta
    zeta: 0.5
    ic: [1.0, 0.0]
  - <<: *defaults                          # hyperparam-sweep zeta
    zeta: 0.6
    ic: [1.0, 0.0]
  - <<: *defaults                          # hyperparam-sweep zeta
    zeta: 0.7
    ic: [1.0, 0.0]

  # ---------------- 7 forced heads: F_j proxies at the test zetas ----------------
  # Weighted toward the primary paper zetas (0.1, 0.2): 2 heads each.
  # Secondary zeta 0.4: 2 heads. Hyperparam zeta 0.5: 1 head.

  # PRIMARY: zeta=0.1 -- main paper test, slowest decay, basis needs to span
  # significant amplitude through t=15 (~0.22 of initial). F_1 and F_2 proxies.
  # coef_scale: 10 -> random coefs drawn from Uniform(0, 10*2/m) instead of Uniform(0, 2/m),
  # giving O(10) forcing amplitudes so the training solution has comparable scale
  # to the unforced u_0(0)=1 response.
  - <<: *defaults
    zeta: 0.1
    mu: 3
    forcing: { freq: [1.0, 3.0], coef: random, coef_scale: 10 }
  - <<: *defaults
    zeta: 0.1
    mu: 3
    forcing: { freq: [1, 3, 5], coef: random, coef_scale: 10 }

  # PRIMARY: zeta=0.2 -- second paper test zeta. F_1 and F_2 proxies.
  - <<: *defaults
    zeta: 0.2
    mu: 3
    forcing: { freq: [1.0, 3.0], coef: random, coef_scale: 10 }
  - <<: *defaults
    zeta: 0.2
    mu: 3
    forcing: { freq: [1, 3, 5], coef: random, coef_scale: 10 }

  # SECONDARY: zeta=0.4 -- epsilon-sweep test. F_1 and F_2 proxies.
  - <<: *defaults
    zeta: 0.4
    mu: 3
    forcing: { freq: [1.0, 3.0], coef: random, coef_scale: 10 }
  - <<: *defaults
    zeta: 0.4
    mu: 3
    forcing: { freq: [1, 3, 5], coef: random, coef_scale: 10 }

  # HYPERPARAM-SWEEP: zeta=0.5 -- one F_1 proxy for spectral richness here.
  - <<: *defaults
    zeta: 0.5
    mu: 3
    forcing: { freq: [1.0, 3.0], coef: random, coef_scale: 10 }

train:
  method: equally-spaced-noisy
  lr: 1e-3
  # num_iter matched to undamped.yaml / underdamped_nonlinear.yaml (same arch).
  num_iter: 15000
  step_size: 500
  gamma: 0.96
  w_ode: 1.5
  w_ic: 1
  hidden_layers: [128, 128, 256]
  use_sine: True
  use_fourier: True
  n_frequencies: 16
  scale: 1.0
  bias: True
